name: Deploy to Firebase

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, Build, Test & Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check & Build
        run: npm run build

      - name: Unit tests
        run: npm run test:run

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Save verified hosting build
        uses: actions/upload-artifact@v7
        with:
          name: firebase-hosting-dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Firebase Hosting
    needs: verify
    environment:
      name: production
      url: https://lemon-screenplay-dashboard.web.app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download verified hosting build
        uses: actions/download-artifact@v8
        with:
          name: firebase-hosting-dist
          path: dist/

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v13.29.1
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Courtesy notification only. Never fail a successful production deploy
      # because a comment could not be posted.
      - name: Comment on merged PR
        if: success()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const commits = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = commits.data.filter(pr => pr.merged_at);
            for (const pr of merged) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🍋 **Deployed!** This PR was successfully deployed to Firebase Hosting.\n\nCommit: \`${context.sha.slice(0, 7)}\`\nWorkflow: [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
            }
