name: Anthropic model catalog check

env:
  NODE_VERSION: "22.22.3"

on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-model-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test catalog selection
        run: npm run models:test
      - name: Refresh observed catalog
        run: npm run models:refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Open draft catalog review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/config/anthropic-model-catalog.json; then
            echo "No catalog change."
            exit 0
          fi

          branch="codex/anthropic-model-catalog-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/config/anthropic-model-catalog.json
          git commit -m "chore(models): refresh Anthropic catalog"
          git push --set-upstream origin "$branch"
          gh pr create --draft \
            --title "chore(models): review Anthropic catalog update" \
            --body "Updates latestObserved from the Anthropic Models API. Approved production scoring routes remain unchanged and still require benchmark approval."
