name: CI

env:
  NODE_VERSION: "22.22.3"
  PYTHON_VERSION: "3.13.13"
  JAVA_VERSION: "21.0.12"
  FIREBASE_TOOLS_VERSION: "15.14.0"

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: execution/requirements.txt

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r execution/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Type-check & Build
        run: npm run build

      - name: Dashboard, Functions, Python, and rules tests
        run: npm run test:full
